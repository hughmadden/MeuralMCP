server {
    listen 443 ssl http2;
    server_name meural-mcp.example.test;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/meural-mcp.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meural-mcp.example.test/privkey.pem;

    # Set MEURAL_MCP_ALLOWED_HOSTS=meural-mcp.example.test on the service, or the
    # transport's DNS-rebinding protection rejects requests carrying this Host.
    location / {
        proxy_pass http://127.0.0.1:8733;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # MCP uses a streamable response; buffering breaks it
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
