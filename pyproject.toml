[project]
name = "meural-mcp"
version = "0.2.0"
description = "Local API, REST and MCP control for Meural Canvas frames"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "requests>=2.32,<3.0",
  "mcp>=1.13,<2.0",
  "pillow>=10.0",
]

[project.scripts]
meural-mcp = "meural_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
